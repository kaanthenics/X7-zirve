<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X7</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-box">
        <h1>Hoş Geldin!</h1>
        <p class="subtitle">Devam etmek için giriş yap.</p>

        <button class="social-btn google-btn">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l6-6C33.5 6.5 29 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.5-.2-3-.4-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c2.8 0 5.3 1 7.3 2.7l6-6C33.5 6.5 29 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.8z"/><path fill="#4CAF50" d="M24 45.5c5 0 9.5-1.9 12.9-5l-6-5.1c-2 1.4-4.6 2.2-7 2.2-5.3 0-9.7-2.6-11.3-6.9l-6.5 5C9.7 41.1 16.3 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.3 4.3-4.4 5.7l6 5.1C40.5 35.9 44.5 30.9 44.5 25c0-1.5-.2-3-.4-4.5z"/></svg>
            Google ile Giriş Yap
        </button>
        <button class="social-btn facebook-btn">
            <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12c0 5 3.7 9.1 8.4 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7C18.3 21.1 22 17 22 12z"/></svg>
            Facebook ile Giriş Yap
        </button>

        <div class="divider"><span>VEYA</span></div>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email adresinizi girin">

        <div class="password-label-row">
            <label for="password">Şifre</label>
            <a href="#" class="forgot-link">Şifremi unuttum?</a>
        </div>
        <input type="password" id="password" placeholder="Şifrenizi girin">

        <button class="submit-btn">Giriş Yap</button>

        <p class="signup-text">Hesabın yok mu? <a href="#">Kayıt Ol</a></p>
    </div>
</body>
</html>
