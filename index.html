<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X7</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-box">
        <h1>Hoş Geldin!</h1>
        <p class="subtitle">Devam etmek için giriş yap.</p>

        <button class="social-btn google-btn">Google ile Giriş Yap</button>
        <button class="social-btn facebook-btn">Facebook ile Giriş Yap</button>

        <div class="divider"><span>VEYA</span></div>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email adresinizi girin">

        <div class="password-label-row">
            <label for="password">Şifre</label>
            <a href="#" class="forgot-link">Şifremi unuttum?</a>
        </div>
        <input type="password" id="password" placeholder="Şifrenizi girin">

        <button class="submit-btn">Giriş Yap</button>

        <p class="signup-text">Hesabın yok mu? <a href="#">Kayıt Ol</a></p>
    </div>
</body>
</html>
